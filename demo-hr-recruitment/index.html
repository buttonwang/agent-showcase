<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>招聘管理后台 · 业务助手智能体 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  :root {
    --background: 0 0% 100%;
    --foreground: 222.2 47.4% 11.2%;
    --card: 0 0% 100%;
    --border: 214.3 31.8% 91.4%;
    --primary: 221.2 83.2% 53.3%;
    --primary-foreground: 210 40% 98%;
    --muted: 210 40% 96.1%;
    --muted-foreground: 215.4 16.3% 46.9%;
    --success: 142.1 76.2% 36.3%;
    --destructive: 0 84.2% 60.2%;
    --warning: 38 92% 50%;
    --radius: 0.5rem;
  }
  .dark {
    --background: 222.2 47.4% 6%;
    --foreground: 210 40% 98%;
    --card: 222.2 47.4% 8%;
    --border: 217.2 32.6% 17.5%;
    --primary: 217 91% 60%;
    --muted: 217.2 32.6% 17.5%;
    --muted-foreground: 215 20.2% 65.1%;
    --success: 142.1 70% 45%;
    --destructive: 0 72% 51%;
  }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  [x-cloak] { display: none !important; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 4px; }
</style>
<script>
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.classList.add('dark'); }
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        background: 'hsl(var(--background))', foreground: 'hsl(var(--foreground))', card: 'hsl(var(--card))', border: 'hsl(var(--border))',
        primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
        muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
        success: 'hsl(var(--success))', destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--primary-foreground))' }, warning: 'hsl(var(--warning))',
      },
      borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
    } },
    safelist: ['bg-emerald-100','text-emerald-700','bg-emerald-500/20','text-emerald-300','bg-amber-100','text-amber-700','bg-amber-500/20','text-amber-300','bg-rose-100','text-rose-700','bg-rose-500/20','text-rose-300','bg-blue-100','text-blue-700','bg-blue-500/20','text-blue-300','bg-slate-100','text-slate-700','bg-slate-500/20','text-slate-300','bg-indigo-100','text-indigo-700','bg-indigo-500/20','text-indigo-300','bg-violet-100','text-violet-700','bg-violet-500/20','text-violet-300'],
  };
</script>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <!-- 顶部栏 -->
  <header class="fixed inset-x-0 top-0 z-30 h-16 border-b border-border bg-background/80 backdrop-blur">
    <div class="flex h-full items-center justify-between px-4 sm:px-6">
      <div class="flex items-center gap-3">
        <button @click="drawerOpen = !drawerOpen" class="inline-flex h-9 w-9 items-center justify-center rounded-md hover:bg-muted lg:hidden" aria-label="打开菜单"><i data-lucide="menu" class="h-5 w-5"></i></button>
        <div class="flex items-center gap-2 font-semibold"><i data-lucide="users-round" class="h-5 w-5 text-primary"></i><span>招聘管理后台</span></div>
      </div>
      <div class="hidden flex-1 px-8 md:block max-w-md">
        <div class="relative">
          <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"></i>
          <input x-model="listQuery" type="text" placeholder="搜索职位或候选人..." class="h-9 w-full rounded-md border border-border bg-muted/50 pl-9 pr-3 text-sm placeholder:text-muted-foreground focus:bg-background focus:outline-none" />
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button @click="toggleTheme()" class="inline-flex h-9 w-9 items-center justify-center rounded-md hover:bg-muted" :aria-label="dark ? '切换到浅色' : '切换到深色'"><i :data-lucide="dark ? 'sun' : 'moon'" class="h-4 w-4"></i></button>
        <div class="ml-2 flex items-center gap-2 rounded-full border border-border p-0.5 pr-3">
          <div class="flex h-7 w-7 items-center justify-center rounded-full bg-primary text-xs font-semibold text-primary-foreground" x-text="product.avatar_initial"></div>
          <span class="hidden text-sm font-medium sm:inline" x-text="product.user_name"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- 左侧导航 -->
  <aside :class="drawerOpen ? 'translate-x-0' : '-translate-x-full'" class="fixed inset-y-0 left-0 z-20 w-60 transform border-r border-border bg-background pt-16 transition-transform duration-200 lg:translate-x-0">
    <nav class="h-full overflow-y-auto p-3 space-y-1">
      <template x-for="group in navGroups" :key="group.id">
        <div>
          <button @click="toggleGroup(group.id)" class="flex w-full items-center justify-between rounded-md px-3 py-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground hover:text-foreground">
            <span x-text="group.label"></span>
            <i :data-lucide="groupOpen[group.id] ? 'chevron-down' : 'chevron-right'" class="h-3.5 w-3.5"></i>
          </button>
          <div x-show="groupOpen[group.id]" class="mt-1 space-y-0.5">
            <template x-for="item in group.items" :key="item.page">
              <a @click="go(item.page)" :class="page === item.page ? 'bg-primary/10 text-primary font-medium' : 'text-muted-foreground hover:bg-muted hover:text-foreground'" class="flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-sm">
                <i :data-lucide="item.icon" class="h-4 w-4"></i>
                <span x-text="item.label"></span>
                <span x-show="item.badge" class="ml-auto rounded-full bg-primary px-1.5 py-0.5 text-[10px] font-medium text-primary-foreground" x-text="item.badge"></span>
              </a>
            </template>
          </div>
        </div>
      </template>
    </nav>
  </aside>

  <div x-show="drawerOpen" x-cloak class="fixed inset-0 z-10 bg-foreground/40 lg:hidden" @click="drawerOpen = false"></div>

  <!-- 主区 -->
  <main class="lg:pl-60 pt-16 min-h-screen">
    <div class="mx-auto max-w-6xl">

      <!-- 仪表盘 -->
      <div x-show="page === 'dashboard'" class="px-6 py-8">
        <div class="mb-6 flex items-end justify-between">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight" x-text="dashboard.title"></h1>
            <p class="mt-1 text-sm text-muted-foreground" x-text="dashboard.subtitle"></p>
          </div>
          <button @click="go('requirements')" class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:opacity-90"><i data-lucide="plus" class="h-4 w-4"></i> 发布新需求</button>
        </div>
        <section class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <template x-for="kpi in dashboard.kpis" :key="kpi.label">
            <div class="rounded-lg border border-border bg-card p-5">
              <div class="flex items-center justify-between">
                <div class="text-sm text-muted-foreground" x-text="kpi.label"></div>
                <i :data-lucide="kpi.icon" class="h-4 w-4 text-muted-foreground"></i>
              </div>
              <div class="mt-2 text-2xl font-semibold" x-text="kpi.value"></div>
              <div class="mt-1 text-xs text-muted-foreground" x-text="kpi.subtitle"></div>
            </div>
          </template>
        </section>
        <section class="grid grid-cols-1 gap-4 lg:grid-cols-3">
          <div class="rounded-lg border border-border bg-card lg:col-span-2">
            <div class="border-b border-border px-5 py-3 flex items-center justify-between">
              <h2 class="text-base font-semibold">招聘漏斗</h2>
              <span class="text-xs text-muted-foreground">本月数据</span>
            </div>
            <div class="p-5 space-y-3">
              <template x-for="(stage, idx) in dashboard.funnel" :key="stage.label">
                <div>
                  <div class="mb-1 flex items-center justify-between text-sm">
                    <span class="font-medium" x-text="stage.label"></span>
                    <span class="text-muted-foreground"><span x-text="stage.count"></span> 人 · <span x-text="stage.rate"></span>%</span>
                  </div>
                  <div class="h-2 w-full overflow-hidden rounded-full bg-muted">
                    <div class="h-full rounded-full bg-primary" :style="'width:' + stage.rate + '%'"></div>
                  </div>
                </div>
              </template>
            </div>
          </div>
          <div class="rounded-lg border border-border bg-card">
            <div class="border-b border-border px-5 py-3"><h2 class="text-base font-semibold">待办事项</h2></div>
            <ul class="divide-y divide-border">
              <template x-for="todo in dashboard.todos" :key="todo.title">
                <li class="flex items-start gap-3 px-5 py-3">
                  <div class="mt-1 h-2 w-2 rounded-full" :class="todo.color"></div>
                  <div class="flex-1">
                    <div class="text-sm font-medium" x-text="todo.title"></div>
                    <div class="text-xs text-muted-foreground" x-text="todo.subtitle"></div>
                  </div>
                </li>
              </template>
            </ul>
          </div>
        </section>
      </div>

      <!-- 招聘需求列表 -->
      <div x-show="page === 'requirements'" class="px-6 py-8">
        <div class="mb-6 flex items-end justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">招聘需求</h1>
            <p class="mt-1 text-sm text-muted-foreground">所有用人部门提交的岗位需求</p>
          </div>
          <button @click="openReqCreate()" class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:opacity-90"><i data-lucide="plus" class="h-4 w-4"></i> 发布新需求</button>
        </div>
        <div class="overflow-hidden rounded-lg border border-border bg-card">
          <table class="w-full text-sm">
            <thead class="bg-muted/40 text-xs uppercase tracking-wide text-muted-foreground">
              <tr>
                <th class="px-4 py-3 text-left font-medium">职位</th>
                <th class="px-4 py-3 text-left font-medium">部门</th>
                <th class="px-4 py-3 text-left font-medium">HR 负责人</th>
                <th class="px-4 py-3 text-left font-medium">紧急度</th>
                <th class="px-4 py-3 text-left font-medium">状态</th>
                <th class="px-4 py-3 text-right font-medium">操作</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-border">
              <template x-for="req in requirements" :key="req.id">
                <tr class="hover:bg-muted/30">
                  <td class="px-4 py-3 font-medium" x-text="req.title"></td>
                  <td class="px-4 py-3 text-muted-foreground" x-text="req.dept"></td>
                  <td class="px-4 py-3 text-muted-foreground" x-text="req.owner"></td>
                  <td class="px-4 py-3"><span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" :class="req.priority_class" x-text="req.priority_label"></span></td>
                  <td class="px-4 py-3"><span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" :class="req.status_class" x-text="req.status_label"></span></td>
                  <td class="px-4 py-3 text-right">
                    <div class="inline-flex items-center gap-1">
                      <button @click="openReqEdit(req.id)" class="inline-flex h-8 w-8 items-center justify-center rounded-md hover:bg-muted" aria-label="编辑"><i data-lucide="pencil" class="h-4 w-4"></i></button>
                      <button @click="askDelete('req', req.id, req.title)" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-destructive hover:bg-destructive/10" aria-label="删除"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                    </div>
                  </td>
                </tr>
              </template>
              <tr x-show="requirements.length === 0">
                <td colspan="6" class="px-4 py-12 text-center text-sm text-muted-foreground"><i data-lucide="inbox" class="mx-auto mb-2 h-8 w-8"></i><div>暂无招聘需求</div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 候选人管道(看板) -->
      <div x-show="page === 'pipeline'" class="px-6 py-8">
        <div class="mb-6 flex items-end justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">候选人管道</h1>
            <p class="mt-1 text-sm text-muted-foreground">拖动候选人切换阶段</p>
          </div>
          <button @click="openCandidateCreate()" class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:opacity-90"><i data-lucide="plus" class="h-4 w-4"></i> 添加候选人</button>
        </div>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-5">
          <template x-for="col in pipeline.columns" :key="col.id">
            <div class="rounded-lg border border-border bg-muted/30 p-3" @dragover.prevent="dragOverCol = col.id" @dragleave="if (dragOverCol === col.id) dragOverCol = ''" @drop.prevent="onDropPipeline(col.id)" :class="dragOverCol === col.id ? 'ring-2 ring-primary/40' : ''">
              <div class="mb-3 flex items-center justify-between px-1">
                <div class="flex items-center gap-2">
                  <span class="h-2 w-2 rounded-full" :class="col.color"></span>
                  <h3 class="text-sm font-semibold" x-text="col.title"></h3>
                  <span class="text-xs text-muted-foreground" x-text="col.candidates.length"></span>
                </div>
                <button @click="openCandidateCreate(col.id)" class="inline-flex h-6 w-6 items-center justify-center rounded-md hover:bg-background" aria-label="新增"><i data-lucide="plus" class="h-3.5 w-3.5"></i></button>
              </div>
              <div class="space-y-2 min-h-[60px]">
                <template x-for="c in col.candidates" :key="c.id">
                  <div class="rounded-md border border-border bg-card p-3 shadow-sm cursor-grab active:cursor-grabbing" draggable="true" @dragstart="onDragStart($event, c.id, 'pipeline', col.id)" @dragend="onDragEnd()">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="text-sm font-medium leading-snug" x-text="c.name"></div>
                        <div class="mt-0.5 text-xs text-muted-foreground" x-text="c.role"></div>
                      </div>
                      <button @click="askDelete('candidate', c.id, c.name)" class="inline-flex h-6 w-6 items-center justify-center rounded-md text-destructive hover:bg-destructive/10" aria-label="删除"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
                    </div>
                    <div class="mt-2 flex items-center justify-between text-xs">
                      <span class="text-muted-foreground" x-text="c.round"></span>
                      <span class="font-medium" :class="c.match_class" x-text="c.match"></span>
                    </div>
                  </div>
                </template>
                <div x-show="col.candidates.length === 0" class="rounded-md border border-dashed border-border py-6 text-center text-xs text-muted-foreground">拖动到此或点击 + 添加</div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- 面试记录 -->
      <div x-show="page === 'interviews'" class="px-6 py-8">
        <div class="mb-6 flex items-end justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">面试记录</h1>
            <p class="mt-1 text-sm text-muted-foreground">所有轮次面试的评价与结果</p>
          </div>
          <button @click="openInterviewCreate()" class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:opacity-90"><i data-lucide="plus" class="h-4 w-4"></i> 记录面试</button>
        </div>
        <div class="overflow-hidden rounded-lg border border-border bg-card">
          <table class="w-full text-sm">
            <thead class="bg-muted/40 text-xs uppercase tracking-wide text-muted-foreground">
              <tr>
                <th class="px-4 py-3 text-left font-medium">候选人</th>
                <th class="px-4 py-3 text-left font-medium">轮次</th>
                <th class="px-4 py-3 text-left font-medium">面试官</th>
                <th class="px-4 py-3 text-left font-medium">评分</th>
                <th class="px-4 py-3 text-left font-medium">结果</th>
                <th class="px-4 py-3 text-right font-medium">操作</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-border">
              <template x-for="iv in interviews" :key="iv.id">
                <tr class="hover:bg-muted/30">
                  <td class="px-4 py-3 font-medium" x-text="iv.candidate"></td>
                  <td class="px-4 py-3 text-muted-foreground" x-text="iv.round"></td>
                  <td class="px-4 py-3 text-muted-foreground" x-text="iv.interviewer"></td>
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-0.5">
                      <template x-for="i in 5"><i :data-lucide="i <= iv.score ? 'star' : 'star-off'" :class="i <= iv.score ? 'h-3.5 w-3.5 text-amber-500 fill-amber-500' : 'h-3.5 w-3.5 text-muted-foreground/30'"></i></template>
                    </div>
                  </td>
                  <td class="px-4 py-3"><span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" :class="iv.result_class" x-text="iv.result_label"></span></td>
                  <td class="px-4 py-3 text-right">
                    <button @click="askDelete('interview', iv.id, iv.candidate + ' - ' + iv.round)" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-destructive hover:bg-destructive/10" aria-label="删除"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                  </td>
                </tr>
              </template>
              <tr x-show="interviews.length === 0">
                <td colspan="6" class="px-4 py-12 text-center text-sm text-muted-foreground"><i data-lucide="calendar-clock" class="mx-auto mb-2 h-8 w-8"></i><div>暂无面试记录</div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 入职调查 -->
      <div x-show="page === 'onboarding'" class="px-6 py-8">
        <div class="mb-6 flex items-end justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">入职调查</h1>
            <p class="mt-1 text-sm text-muted-foreground">新员工入职 30 天反馈</p>
          </div>
          <button @click="openOnboardCreate()" class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:opacity-90"><i data-lucide="plus" class="h-4 w-4"></i> 新建调查</button>
        </div>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <template x-for="s in onboardings" :key="s.id">
            <div class="rounded-lg border border-border bg-card p-5">
              <div class="flex items-start justify-between">
                <div>
                  <div class="text-base font-semibold" x-text="s.employee"></div>
                  <div class="mt-0.5 text-xs text-muted-foreground" x-text="s.dept + ' · 入职 ' + s.days + ' 天'"></div>
                </div>
                <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" :class="s.satisfaction_class" x-text="s.satisfaction_label"></span>
              </div>
              <div class="mt-3 grid grid-cols-3 gap-2 text-center">
                <div class="rounded-md border border-border p-2">
                  <div class="text-xs text-muted-foreground">环境适应</div>
                  <div class="mt-1 text-lg font-semibold" :class="s.env >= 4 ? 'text-emerald-600' : s.env >= 3 ? 'text-amber-600' : 'text-rose-600'" x-text="s.env + '/5'"></div>
                </div>
                <div class="rounded-md border border-border p-2">
                  <div class="text-xs text-muted-foreground">导师帮助</div>
                  <div class="mt-1 text-lg font-semibold" :class="s.mentor >= 4 ? 'text-emerald-600' : s.mentor >= 3 ? 'text-amber-600' : 'text-rose-600'" x-text="s.mentor + '/5'"></div>
                </div>
                <div class="rounded-md border border-border p-2">
                  <div class="text-xs text-muted-foreground">工作清晰</div>
                  <div class="mt-1 text-lg font-semibold" :class="s.clarity >= 4 ? 'text-emerald-600' : s.clarity >= 3 ? 'text-amber-600' : 'text-rose-600'" x-text="s.clarity + '/5'"></div>
                </div>
              </div>
              <div class="mt-3 text-sm text-foreground/90" x-text="s.note"></div>
              <div class="mt-3 flex items-center justify-end gap-1 border-t border-border pt-3">
                <button @click="askDelete('onboard', s.id, s.employee)" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-destructive hover:bg-destructive/10" aria-label="删除"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- 设置 -->
      <div x-show="page === 'settings'" class="px-6 py-8">
        <div class="mb-6">
          <h1 class="text-2xl font-semibold tracking-tight">设置</h1>
          <p class="mt-1 text-sm text-muted-foreground">招聘流程与权限</p>
        </div>
        <div class="grid grid-cols-1 gap-6 md:grid-cols-[220px_1fr]">
          <nav class="space-y-1">

        { id: 3, employee: '徐刚', dept: '运营部', days: 7, env: 4, mentor: 4, clarity: 5, satisfaction_label: '满意', satisfaction_class: 'bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-300', note: '工作目标明确,工具齐全。' },
      ],
    };
  </script>

  <!-- Alpine app() -->
  <script>
    function app() {
      const D = window.__APP_DATA__ || {};
      const PRIO_CLS = { high: 'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300', mid: 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300', low: 'bg-slate-100 text-slate-700 dark:bg-slate-500/20 dark:text-slate-300' };
      const PRIO_LBL = { high: '高', mid: '中', low: '低' };
      const STAT_CLS = { open: 'bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-300', paused: 'bg-slate-100 text-slate-700 dark:bg-slate-500/20 dark:text-slate-300', filled: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300' };
      const STAT_LBL = { open: '招聘中', paused: '已暂停', filled: '已招到' };
      const RES_CLS = { pass: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300', hold: 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300', fail: 'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300' };
      const RES_LBL = { pass: '通过', hold: '待定', fail: '不通过' };
      const MATCH_CLS = { high: 'text-emerald-600', mid: 'text-amber-600', low: 'text-rose-600' };
      return {
        product: D.product || {},
        navGroups: D.nav_groups || [],
        dashboard: D.dashboard || { kpis: [], funnel: [], todos: [] },
        requirements: D.requirements || [],
        pipeline: D.pipeline || { columns: [] },
        interviews: D.interviews || [],
        onboardings: D.onboardings || [],
        page: 'dashboard',
        drawerOpen: false,
        groupOpen: {},
        dark: false,
        listQuery: '',
        dragCardId: null,
        dragFromCol: null,
        dragOverCol: null,
        modal: { open: false, kind: '', mode: '', form: {} },
        confirm: { open: false, kind: '', id: null, title: '' },
        init() {
          try { const s = localStorage.getItem(this.themeKey()); this.dark = s === 'dark' || (s === null && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { this.dark = false; }
          this.applyTheme();
          (this.navGroups || []).forEach(g => { this.groupOpen[g.id] = true; });
          this.loadAll();
          window.addEventListener('hashchange', () => this.syncPageFromHash());
          this.syncPageFromHash();
          this.$nextTick(() => { try { window.lucide && window.lucide.createIcons(); } catch (e) {} });
        },
        themeKey() { return (this.product.storage_key || 'app') + '__theme'; },
        applyTheme() { document.documentElement.classList.toggle('dark', this.dark); },
        toggleTheme() { this.dark = !this.dark; this.applyTheme(); try { localStorage.setItem(this.themeKey(), this.dark ? 'dark' : 'light'); } catch (e) {} },
        go(page) { this.page = page; this.drawerOpen = false; if (window.location.hash !== '#' + page) { window.location.hash = page; } this.$nextTick(() => { try { window.lucide && window.lucide.createIcons(); } catch (e) {} }); },
        syncPageFromHash() { const h = (window.location.hash || '#dashboard').slice(1); const valid = ['dashboard','requirements','pipeline','interviews','onboarding','settings']; this.page = valid.includes(h) ? h : 'dashboard'; this.$nextTick(() => { try { window.lucide && window.lucide.createIcons(); } catch (e) {} }); },
        toggleGroup(id) { this.groupOpen[id] = !this.groupOpen[id]; this.$nextTick(() => { try { window.lucide && window.lucide.createIcons(); } catch (e) {} }); },

        // 需求 CRUD
        openReqCreate() { this.modal = { open: true, kind: 'req', mode: 'create', form: { title: '', dept: '', owner: '', priority: 'mid' } }; this.$nextTick(() => window.lucide && window.lucide.createIcons()); },
        openReqEdit(id) { const r = (this.requirements || []).find(x => x.id === id); if (!r) return; this.modal = { open: true, kind: 'req', mode: 'edit', form: { ...r } }; this.$nextTick(() => window.lucide && window.lucide.createIcons()); },
        saveReq() {
          const f = this.modal.form;
          const pcls = PRIO_CLS[f.priority] || PRIO_CLS.mid; const plbl = PRIO_LBL[f.priority] || '中';
          if (this.modal.mode === 'edit' && f.id) {
            const idx = this.requirements.findIndex(x => x.id === f.id);
            if (idx >= 0) this.requirements[idx] = { ...this.requirements[idx], ...f, priority_class: pcls, priority_label: plbl };
          } else {
            const id = Date.now() + Math.floor(Math.random() * 1000);
            this.requirements.unshift({ ...f, id, priority_class: pcls, priority_label: plbl, status: 'open', status_label: '招聘中', status_class: STAT_CLS.open });
          }
          this.saveAll(); this.closeModal();
        },

        // 候选人 CRUD
        openCandidateCreate(stage) { const def = stage || (this.pipeline.columns[0] && this.pipeline.columns[0].id) || ''; this.modal = { open: true, kind: 'candidate', mode: 'create', form: { name: '', role: '', stage: def, match: 'mid' } }; this.$nextTick(() => window.lucide && window.lucide.createIcons()); },
        saveCandidate() {
          const f = this.modal.form;
          const col = this.pipeline.columns.find(c => c.id === f.stage) || this.pipeline.columns[0];
          col.candidates = col.candidates || [];
          col.candidates.unshift({ id: Date.now() + Math.floor(Math.random()*1000), name: f.name, role: f.role, round: '新加入', match: f.match === 'high' ? '高' : f.match === 'mid' ? '中' : '低', match_class: MATCH_CLS[f.match] || MATCH_CLS.mid });
          this.saveAll(); this.closeModal();
        },

        // 面试 CRUD
        openInterviewCreate() { this.modal = { open: true, kind: 'interview', mode: 'create', form: { candidate: '', round: 'HR 初面', interviewer: '', score: 4, result: 'pass' } }; this.$nextTick(() => window.lucide && window.lucide.createIcons()); },
        saveInterview() {
          const f = this.modal.form;
          this.interviews.unshift({ id: Date.now() + Math.floor(Math.random()*1000), candidate: f.candidate, round: f.round, interviewer: f.interviewer, score: Number(f.score) || 4, result: f.result, result_label: RES_LBL[f.result], result_class: RES_CLS[f.result] });
          this.saveAll(); this.closeModal();
        },

        // 入职调查 CRUD
        openOnboardCreate() { this.modal = { open: true, kind: 'onboard', mode: 'create', form: { employee: '', dept: '', days: 30, env: 4, mentor: 4, clarity: 4, note: '' } }; this.$nextTick(() => window.lucide && window.lucide.createIcons()); },
        saveOnboard() {
          const f = this.modal.form;
          const avg = (Number(f.env) + Number(f.mentor) + Number(f.clarity)) / 3;
          const sat = avg >= 4.5 ? { lbl: '非常满意', cls: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300' } : avg >= 3.5 ? { lbl: '满意', cls: 'bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-300' } : avg >= 2.5 ? { lbl: '一般', cls: 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300' } : { lbl: '不满意', cls: 'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300' };
          this.onboardings.unshift({ id: Date.now() + Math.floor(Math.random()*1000), employee: f.employee, dept: f.dept, days: Number(f.days) || 30, env: Number(f.env) || 4, mentor: Number(f.mentor) || 4, clarity: Number(f.clarity) || 4, satisfaction_label: sat.lbl, satisfaction_class: sat.cls, note: f.note || '' });
          this.saveAll(); this.closeModal();
        },

        // 拖拽(候选人)
        onDragStart(ev, id, kind, fromCol) { this.dragCardId = id; this.dragFromCol = fromCol; try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(id)); } catch (e) {} },
        onDragEnd() { this.dragCardId = null; this.dragFromCol = null; this.dragOverCol = null; },
        onDropPipeline(toCol) {
          const id = this.dragCardId; if (!id || !toCol) { this.onDragEnd(); return; }
          let card = null;
          for (const c of (this.pipeline.columns || [])) { const idx = (c.candidates || []).findIndex(x => x.id === id); if (idx >= 0) { [card] = c.candidates.splice(idx, 1); break; } }
          if (!card) { this.onDragEnd(); return; }
          const to = this.pipeline.columns.find(c => c.id === toCol);
          if (to) { to.candidates = to.candidates || []; to.candidates.unshift(card); }
          this.onDragEnd(); this.saveAll();
        },

        // 删除
        askDelete(kind, id, title) { this.confirm = { open: true, kind, id, title: title || '此项' }; this.$nextTick(() => window.lucide && window.lucide.createIcons()); },
        doDelete() {
          const k = this.confirm.kind, id = this.confirm.id;
          if (k === 'req') this.requirements = this.requirements.filter(x => x.id !== id);
          else if (k === 'candidate') (this.pipeline.columns || []).forEach(c => { c.candidates = (c.candidates || []).filter(x => x.id !== id); });
          else if (k === 'interview') this.interviews = this.interviews.filter(x => x.id !== id);
          else if (k === 'onboard') this.onboardings = this.onboardings.filter(x => x.id !== id);
          this.saveAll();
          this.confirm = { open: false, kind: '', id: null, title: '' };
        },

        closeModal() { this.modal = { open: false, kind: '', mode: '', form: {} }; },

        dataKey() { return (this.product.storage_key || 'app') + '__data_v1'; },
        saveAll() { try { localStorage.setItem(this.dataKey(), JSON.stringify({ requirements: this.requirements, pipeline_columns: this.pipeline.columns, interviews: this.interviews, onboardings: this.onboardings })); } catch (e) {} },
        loadAll() { try { const raw = localStorage.getItem(this.dataKey()); if (!raw) return; const d = JSON.parse(raw); if (Array.isArray(d.requirements)) this.requirements = d.requirements; if (Array.isArray(d.pipeline_columns)) this.pipeline.columns = d.pipeline_columns; if (Array.isArray(d.interviews)) this.interviews = d.interviews; if (Array.isArray(d.onboardings)) this.onboardings = d.onboardings; } catch (e) {} },
        exportData() { try { const blob = new Blob([JSON.stringify({ requirements: this.requirements, pipeline_columns: this.pipeline.columns, interviews: this.interviews, onboardings: this.onboardings, exported_at: new Date().toISOString() }, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = (this.product.storage_key || 'app') + '-export.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {} },
      };
    }
  </script>
  <script>
    document.addEventListener('alpine:initialized', () => { try { window.lucide && window.lucide.createIcons(); } catch (e) {} });
  </script>
</body>
