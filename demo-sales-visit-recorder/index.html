<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>销售拜访纪要 · 业务助手智能体 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  :root {
    --background: 0 0% 100%;
    --foreground: 222.2 47.4% 11.2%;
    --card: 0 0% 100%;
    --border: 214.3 31.8% 91.4%;
    --primary: 221.2 83.2% 53.3%;
    --primary-foreground: 210 40% 98%;
    --muted: 210 40% 96.1%;
    --muted-foreground: 215.4 16.3% 46.9%;
    --accent: 221.2 83.2% 53.3%;
    --success: 142.1 76.2% 36.3%;
    --destructive: 0 84.2% 60.2%;
    --warning: 38 92% 50%;
    --radius: 0.5rem;
  }
  .dark {
    --background: 222.2 47.4% 6%;
    --foreground: 210 40% 98%;
    --card: 222.2 47.4% 8%;
    --border: 217.2 32.6% 17.5%;
    --primary: 217 91% 60%;
    --muted: 217.2 32.6% 17.5%;
    --muted-foreground: 215 20.2% 65.1%;
    --success: 142.1 70% 45%;
    --destructive: 0 72% 51%;
  }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  [x-cloak] { display: none !important; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground) / 0.5); }
</style>
<script>
  if (window.matchMedia("(prefers-color-scheme: dark)").matches) { document.documentElement.classList.add("dark"); }
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        background: "hsl(var(--background))", foreground: "hsl(var(--foreground))", card: "hsl(var(--card))", border: "hsl(var(--border))",
        primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
        muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
        accent: "hsl(var(--accent))", success: "hsl(var(--success))", destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--primary-foreground))" }, warning: "hsl(var(--warning))",
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
    } },
    safelist: ["bg-emerald-100","text-emerald-700","bg-emerald-500/20","text-emerald-300","bg-amber-100","text-amber-700","bg-amber-500/20","text-amber-300","bg-rose-100","text-rose-700","bg-rose-500/20","text-rose-300","bg-blue-100","text-blue-700","bg-blue-500/20","text-blue-300","bg-slate-100","text-slate-700","bg-slate-500/20","text-slate-300","bg-indigo-100","text-indigo-700","bg-indigo-500/20","text-indigo-300","bg-emerald-500","bg-amber-500","bg-rose-500","bg-blue-500","bg-slate-500","bg-indigo-500"],
  };
</script>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <!-- 顶部栏 -->
  <header class="fixed inset-x-0 top-0 z-30 h-16 border-b border-border bg-background/80 backdrop-blur">
    <div class="flex h-full items-center justify-between px-4 sm:px-6">
      <div class="flex items-center gap-3">
        <button @click="drawerOpen = !drawerOpen" class="inline-flex h-9 w-9 items-center justify-center rounded-md hover:bg-muted lg:hidden" aria-label="打开菜单"><i data-lucide="menu" class="h-5 w-5"></i></button>
        <div class="flex items-center gap-2 font-semibold"><i data-lucide="sparkles" class="h-5 w-5 text-primary"></i><span>销售拜访纪要</span></div>
      </div>
      <div class="hidden flex-1 px-8 md:block max-w-md">
        <div class="relative">
          <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"></i>
          <input x-model="listQuery" type="text" placeholder="搜索客户或负责人..." class="h-9 w-full rounded-md border border-border bg-muted/50 pl-9 pr-3 text-sm placeholder:text-muted-foreground focus:bg-background focus:outline-none" />
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button @click="toggleTheme()" class="inline-flex h-9 w-9 items-center justify-center rounded-md hover:bg-muted" :aria-label="dark ? '切换到浅色' : '切换到深色'"><i :data-lucide="dark ? 'sun' : 'moon'" class="h-4 w-4"></i></button>
        <button class="relative inline-flex h-9 w-9 items-center justify-center rounded-md hover:bg-muted" aria-label="通知"><i data-lucide="bell" class="h-4 w-4"></i><span class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-destructive"></span></button>
        <div class="ml-2 flex items-center gap-2 rounded-full border border-border p-0.5 pr-3">
          <div class="flex h-7 w-7 items-center justify-center rounded-full bg-primary text-xs font-semibold text-primary-foreground" x-text="product.avatar_initial"></div>
          <span class="hidden text-sm font-medium sm:inline" x-text="product.user_name"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- 左侧导航 -->
  <aside :class="drawerOpen ? 'translate-x-0' : '-translate-x-full'" class="fixed inset-y-0 left-0 z-20 w-60 transform border-r border-border bg-background pt-16 transition-transform duration-200 lg:translate-x-0">
    <nav class="h-full overflow-y-auto p-3 space-y-1">
      <template x-for="group in navGroups" :key="group.id">
        <div>
          <button @click="toggleGroup(group.id)" class="flex w-full items-center justify-between rounded-md px-3 py-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground hover:text-foreground">
            <span x-text="group.label"></span>
            <i :data-lucide="groupOpen[group.id] ? 'chevron-down' : 'chevron-right'" class="h-3.5 w-3.5"></i>
          </button>
          <div x-show="groupOpen[group.id]" x-collapse class="mt-1 space-y-0.5">
            <template x-for="item in group.items" :key="item.page">
              <a @click="go(item.page)" :class="page === item.page ? 'bg-primary/10 text-primary font-medium' : 'text-muted-foreground hover:bg-muted hover:text-foreground'" class="flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-sm">
                <i :data-lucide="item.icon" class="h-4 w-4"></i>
                <span x-text="item.label"></span>
              </a>
            </template>
          </div>
        </div>
      </template>
      <div class="mt-6 border-t border-border pt-4 space-y-0.5">
        <a class="flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground"><i data-lucide="life-buoy" class="h-4 w-4"></i> 帮助中心</a>
        <a class="flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground"><i data-lucide="log-out" class="h-4 w-4"></i> 退出登录</a>
      </div>
    </nav>
  </aside>

  <div x-show="drawerOpen" x-cloak class="fixed inset-0 z-10 bg-foreground/40 lg:hidden" @click="drawerOpen = false"></div>

  <!-- 主区 -->
  <main class="lg:pl-60 pt-16 min-h-screen">
    <div class="mx-auto max-w-6xl">

      <!-- 仪表盘 -->
      <div x-show="page === 'dashboard'" class="px-6 py-8">
        <div class="mb-6 flex items-end justify-between">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight" x-text="dashboard.title"></h1>
            <p class="mt-1 text-sm text-muted-foreground" x-text="dashboard.subtitle"></p>
          </div>
          <button @click="go('list')" class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:opacity-90"><i data-lucide="plus" class="h-4 w-4"></i> 新建拜访</button>
        </div>
        <section class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <template x-for="kpi in dashboard.kpis" :key="kpi.label">
            <div class="rounded-lg border border-border bg-card p-5">
              <div class="flex items-center justify-between">
                <div class="text-sm text-muted-foreground" x-text="kpi.label"></div>
                <i :data-lucide="kpi.icon" class="h-4 w-4 text-muted-foreground"></i>
              </div>
              <div class="mt-2 text-2xl font-semibold" x-text="kpi.value"></div>
              <div class="mt-1 flex items-center gap-1 text-xs" :class="(kpi.delta >= 0) ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'">
                <i :data-lucide="(kpi.delta >= 0) ? 'trending-up' : 'trending-down'" class="h-3.5 w-3.5"></i>
                <span x-text="(kpi.delta >= 0 ? '+' : '') + kpi.delta + '%'"></span>
                <span class="text-muted-foreground">较上周</span>
              </div>
            </div>
          </template>
        </section>
        <section class="grid grid-cols-1 gap-4 lg:grid-cols-3">
          <div class="rounded-lg border border-border bg-card lg:col-span-2">
            <div class="border-b border-border px-5 py-3"><h2 class="text-base font-semibold">最近动态</h2></div>
            <ul class="divide-y divide-border">
              <template x-for="act in dashboard.activities" :key="act.who + act.what">
                <li class="flex items-start gap-3 px-5 py-3">
                  <div class="mt-1 h-2 w-2 rounded-full" :class="act.color"></div>
                  <div class="flex-1">
                    <div class="text-sm"><span class="font-medium" x-text="act.who"></span> <span class="text-muted-foreground" x-text="act.what"></span></div>
                    <div class="text-xs text-muted-foreground" x-text="act.when"></div>
                  </div>
                </li>
              </template>
            </ul>
          </div>
          <div class="rounded-lg border border-border bg-card">
            <div class="border-b border-border px-5 py-3"><h2 class="text-base font-semibold">即将发生</h2></div>
            <ul class="divide-y divide-border">
              <template x-for="ev in dashboard.upcoming" :key="ev.title + ev.when">
                <li class="px-5 py-3">
                  <div class="flex items-center gap-2 text-sm font-medium"><i data-lucide="calendar" class="h-4 w-4 text-accent"></i><span x-text="ev.title"></span></div>
                  <div class="mt-1 text-xs text-muted-foreground" x-text="ev.when"></div>
                </li>
              </template>
            </ul>
          </div>
        </section>
      </div>

      <!-- 列表页 -->
      <div x-show="page === 'list'" class="px-6 py-8">
        <div class="mb-6 flex items-end justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight" x-text="listView.title"></h1>
            <p class="mt-1 text-sm text-muted-foreground" x-text="listView.subtitle"></p>
          </div>
          <button @click="openListCreate()" class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:opacity-90"><i data-lucide="plus" class="h-4 w-4"></i> 新建拜访</button>
        </div>
        <div class="mb-4 flex items-center gap-3 flex-wrap">
          <select x-model="listStatus" class="h-9 rounded-md border border-border bg-background px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50">
            <option value="">全部状态</option>
            <template x-for="opt in listView.status_options" :key="opt.value"><option :value="opt.value" x-text="opt.label"></option></template>
          </select>
          <div class="ml-auto text-xs text-muted-foreground">共 <span class="font-medium text-foreground" x-text="filteredListRows().length"></span> 条</div>
        </div>
        <div class="overflow-hidden rounded-lg border border-border bg-card">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-muted/40 text-xs uppercase tracking-wide text-muted-foreground">
                <tr>
                  <template x-for="col in listView.columns" :key="col.key"><th class="px-4 py-3 text-left font-medium" x-text="col.label"></th></template>
                  <th class="px-4 py-3 text-right font-medium">操作</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-border">
                <template x-for="row in filteredListRows()" :key="row.id">
                  <tr class="hover:bg-muted/30">
                    <td class="px-4 py-3 font-medium" x-text="row.title"></td>
                    <td class="px-4 py-3 text-muted-foreground" x-text="row.customer"></td>
                    <td class="px-4 py-3 text-muted-foreground" x-text="row.owner"></td>
                    <td class="px-4 py-3"><span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" :class="row.status_class" x-text="row.status_label"></span></td>
                    <td class="px-4 py-3 text-muted-foreground" x-text="row.date"></td>
                    <td class="px-4 py-3 text-right">
                      <div class="inline-flex items-center gap-1">
                        <button @click="openListEdit(row.id)" class="inline-flex h-8 w-8 items-center justify-center rounded-md hover:bg-muted" aria-label="编辑"><i data-lucide="pencil" class="h-4 w-4"></i></button>
                        <button @click="openListDetail(row.id)" class="inline-flex h-8 w-8 items-center justify-center rounded-md hover:bg-muted" aria-label="查看"><i data-lucide="eye" class="h-4 w-4"></i></button>
                        <button @click="askDelete('list', row.id, row.title)" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-destructive hover:bg-destructive/10" aria-label="删除"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                      </div>
                    </td>
                  </tr>
                </template>
                <tr x-show="filteredListRows().length === 0">
                  <td :colspan="listView.columns.length + 1" class="px-4 py-12 text-center text-sm text-muted-foreground">
                    <i data-lucide="inbox" class="mx-auto mb-2 h-8 w-8"></i>
                    <div>暂无数据,点击右上角「新建拜访」开始</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 看板 -->
      <div x-show="page === 'kanban'" class="px-6 py-8">
        <div class="mb-6 flex items-end justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight" x-text="kanbanView.title"></h1>
            <p class="mt-1 text-sm text-muted-foreground" x-text="kanbanView.subtitle"></p>
          </div>
          <button @click="openKanbanCreate()" class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:opacity-90"><i data-lucide="plus" class="h-4 w-4"></i> 新建卡片</button>
        </div>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
          <template x-for="col in kanbanView.columns" :key="col.id">
            <div class="rounded-lg border border-border bg-muted/30 p-3" @dragover.prevent="dragOverCol = col.id" @dragleave="if (dragOverCol === col.id) dragOverCol = ''" @drop.prevent="onDropCol(col.id)" :class="dragOverCol === col.id ? 'ring-2 ring-primary/40' : ''">
              <div class="mb-3 flex items-center justify-between px-1">
                <div class="flex items-center gap-2">
                  <span class="h-2 w-2 rounded-full" :class="col.color"></span>
                  <h3 class="text-sm font-semibold" x-text="col.title"></h3>
                  <span class="text-xs text-muted-foreground" x-text="kanbanCards(col.id).length"></span>
                </div>
                <button @click="openKanbanCreate(col.id)" class="inline-flex h-6 w-6 items-center justify-center rounded-md hover:bg-background" aria-label="新增"><i data-lucide="plus" class="h-3.5 w-3.5"></i></button>
              </div>
              <div class="space-y-2 min-h-[60px]">
                <template x-for="card in kanbanCards(col.id)" :key="card.id">
                  <div class="rounded-md border border-border bg-card p-3 shadow-sm cursor-grab active:cursor-grabbing" draggable="true" @dragstart="onDragStart($event, card.id, col.id)" @dragend="onDragEnd()">
                    <div class="flex items-start justify-between gap-2">
                      <div class="text-sm font-medium leading-snug" x-text="card.title"></div>
                      <div class="flex items-center gap-0.5">
                        <button @click="openKanbanEdit(card.id)" class="inline-flex h-6 w-6 items-center justify-center rounded-md text-muted-foreground hover:bg-muted" aria-label="编辑"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
                        <button @click="askDelete('kanban', card.id, card.title)" class="inline-flex h-6 w-6 items-center justify-center rounded-md text-destructive hover:bg-destructive/10" aria-label="删除"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
                      </div>
                    </div>
                    <div class="mt-1 text-xs text-muted-foreground" x-text="card.subtitle"></div>
                    <div class="mt-2 flex items-center justify-between">
                      <span class="inline-flex items-center rounded px-1.5 py-0.5 text-xs font-medium" :class="card.tag_class" x-text="card.tag"></span>
                    </div>
                  </div>
                </template>
                <div x-show="kanbanCards(col.id).length === 0" class="rounded-md border border-dashed border-border py-6 text-center text-xs text-muted-foreground">拖动卡片到此处,或点击 + 新建</div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- 详情页 -->
      <div x-show="page === 'detail'" class="px-6 py-8">
        <div class="mb-4 flex items-center gap-2 text-sm text-muted-foreground">
          <button @click="go('list')" class="inline-flex items-center gap-1 hover:text-foreground"><i data-lucide="arrow-left" class="h-4 w-4"></i> 返回列表</button>
        </div>
        <div class="mb-6 flex items-start justify-between gap-4 flex-wrap">
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-2xl font-semibold tracking-tight" x-text="activeListRow().title || '详情'"></h1>
              <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" :class="activeListRow().status_class" x-text="activeListRow().status_label"></span>
            </div>
            <p class="mt-1 text-sm text-muted-foreground">客户 <span class="font-medium text-foreground" x-text="activeListRow().customer"></span> · 负责人 <span x-text="activeListRow().owner"></span> · <span x-text="activeListRow().date"></span></p>
          </div>
          <div class="flex items-center gap-2">
            <button @click="openListEdit(activeListRow().id)" class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:opacity-90"><i data-lucide="pencil" class="h-4 w-4"></i> 编辑</button>
          </div>
        </div>
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
          <div class="lg:col-span-2 rounded-lg border border-border bg-card p-5">
            <h2 class="mb-3 text-base font-semibold">拜访纪要</h2>
            <p class="text-sm leading-relaxed text-foreground/90" x-text="activeListRow().notes || '暂无纪要内容'"></p>
          </div>
          <aside class="space-y-4">
            <div class="rounded-lg border border-border bg-card p-5">
              <h3 class="mb-3 text-sm font-semibold">属性</h3>
              <dl class="space-y-2 text-sm">
                <div class="flex justify-between"><dt class="text-muted-foreground">客户</dt><dd class="font-medium" x-text="activeListRow().customer"></dd></div>
                <div class="flex justify-between"><dt class="text-muted-foreground">负责人</dt><dd class="font-medium" x-text="activeListRow().owner"></dd></div>
                <div class="flex justify-between"><dt class="text-muted-foreground">日期</dt><dd class="font-medium" x-text="activeListRow().date"></dd></div>
                <div class="flex justify-between"><dt class="text-muted-foreground">状态</dt><dd><span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" :class="activeListRow().status_class" x-text="activeListRow().status_label"></span></dd></div>
              </dl>
            </div>
          </aside>
        </div>
      </div>

      <!-- 设置 -->
      <div x-show="page === 'settings'" class="px-6 py-8">
        <div class="mb-6">
          <h1 class="text-2xl font-semibold tracking-tight">设置</h1>
          <p class="mt-1 text-sm text-muted-foreground">管理你的偏好与账号</p>
        </div>
        <div class="grid grid-cols-1 gap-6 md:grid-cols-[220px_1fr]">
          <nav class="space-y-1">
            <button class="flex w-full items-center gap-2 rounded-md bg-muted px-3 py-2 text-sm font-medium text-foreground"><i data-lucide="user" class="h-4 w-4"></i> 个人资料</button>
            <button class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-muted/50 hover:text-foreground"><i data-lucide="bell" class="h-4 w-4"></i> 通知</button>
            <button class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-muted/50 hover:text-foreground"><i data-lucide="palette" class="h-4 w-4"></i> 外观</button>
            <button @click="exportData()" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-muted/50 hover:text-foreground"><i data-lucide="download" class="h-4 w-4"></i> 导出数据</button>
          </nav>
          <div class="rounded-lg border border-border bg-card p-6">
            <h2 class="text-base font-semibold">个人资料</h2>
            <div class="mt-4 space-y-4 max-w-md">
              <div><label class="block text-sm font-medium">显示名称</label><input type="text" :value="product.user_name" class="mt-1 h-9 w-full rounded-md border border-border bg-background px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50" /></div>

        saveAll() { try { localStorage.setItem(this.dataKey(), JSON.stringify({ list_rows: this.listView.rows || [], kanban_columns: this.kanbanView.columns || [] })); } catch (e) {} },
        loadAll() { try { const raw = localStorage.getItem(this.dataKey()); if (!raw) return; const d = JSON.parse(raw); if (Array.isArray(d.list_rows)) this.listView.rows = d.list_rows; if (Array.isArray(d.kanban_columns)) this.kanbanView.columns = d.kanban_columns; } catch (e) {} },
        exportData() { try { const blob = new Blob([JSON.stringify({ list_rows: this.listView.rows || [], kanban_columns: this.kanbanView.columns || [], exported_at: new Date().toISOString() }, null, 2)], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = (this.product.storage_key || "app") + "-export.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {} },
      };
    }
  </script>

  <script>
    document.addEventListener("alpine:initialized", () => { try { window.lucide && window.lucide.createIcons(); } catch (e) {} });
  </script>
</body>
</html>
